name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate-proofs:
    name: Certificate proof (${{ matrix.shell }}, ${{ matrix.proof }})
    runs-on: windows-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
        proof: [leaf]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.proof }} certificate proof
        run: ./test/${{ matrix.proof }}-proof.ps1

  powershell-tests:
    name: Tests (${{ matrix.label }}, ${{ matrix.suite }})
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
        suite: [certificate, contracts, browser, stale-cleanup, integration]
        include:
          - shell: powershell
            label: Windows PowerShell 5.1
            major: 5
            minor: 1
          - shell: pwsh
            label: PowerShell 7
            major: 7
            minor: 0
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify PowerShell version
        run: |
          $actual = $PSVersionTable.PSVersion
          Write-Host "Running $($PSVersionTable.PSEdition) $actual"
          if ($actual.Major -ne ${{ matrix.major }} -or $actual.Minor -lt ${{ matrix.minor }}) {
            throw "Expected ${{ matrix.label }}; found PowerShell $actual"
          }

      - name: Run ${{ matrix.suite }} suite
        env:
          MIHARI_TEST_ARTIFACT_DIR: ${{ runner.temp }}/mihari-test-artifacts
        run: |
          if (-not (Test-Path -LiteralPath './test/run.ps1' -PathType Leaf)) {
            throw 'Repository test entry point test/run.ps1 is missing.'
          }
          & ./test/run.ps1 -Suite '${{ matrix.suite }}'

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.shell }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/mihari-test-artifacts/
          if-no-files-found: ignore
